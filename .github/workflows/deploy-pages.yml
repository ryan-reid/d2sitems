name: Deploy 100% Client-Side D2R Armory to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Match BT-BKDiff's Publish Wiki workflow.
    - cron: '0 10 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update submodules to configured branches
        run: git submodule update --init --recursive --remote

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh BKDiablo build inputs
        run: python scripts/prepare_release.py

      - name: Check release monitor and generated catalog
        run: python -m unittest tests/test_release_monitor.py tests/test_catalog.py

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Export current unique item catalog
        run: dotnet run --project d2sitems.csproj -c Release -- export-unique-catalog web/unique_items_catalog.json --excel mods/BKDiablo/bkdiablo.mpq/data/global/excel

      - name: Publish WebAssembly Engine
        run: |
          dotnet publish src/D2SWasm/D2SWasm.csproj -c Release -o web/wasm
          cp -r web/wasm/wwwroot/_framework web/
          rm -rf web/wasm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
